server {
    listen 5173;
    # 任意 Host（VPS 用 IP/域名访问时与本地一致）
    server_name _;
    client_max_body_size 1024m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # AI 流式总结：关闭缓冲，否则首包被攒满才下发
    location ^~ /api/ai/summarize/stream/ {
        proxy_pass http://backend:9876/api/ai/summarize/stream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 反向代理后端API（AI 总结等可能 >60s，需放宽避免 nginx 先断连）
    location /api/ {
        proxy_pass http://backend:9876/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 上传附件预览
    location /media/ {
        alias /usr/share/nginx/media/;
        try_files $uri =404;
    }
}